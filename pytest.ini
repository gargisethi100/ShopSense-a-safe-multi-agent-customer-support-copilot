; pytest configuration - and the fix for a bug CI found on its first run.
;
; THE BUG
;   Locally we always ran `python -m pytest`. The `-m` form puts the CURRENT
;   DIRECTORY on sys.path, so `from config import ...` resolved and 16 tests
;   passed in 2 seconds. CI ran bare `pytest`, which does NOT add the current
;   directory - so every import of our own code failed with
;   ModuleNotFoundError, and the pipeline went red on its very first run.
;
;   Same tests, same machine, same code. Different invocation.
;
; THE FIX
;   `pythonpath = .` makes pytest add the project root to sys.path itself, so
;   the suite behaves identically however it is launched: `pytest`,
;   `python -m pytest`, from an IDE's test runner, or from a CI step written
;   by someone who has never seen this file.
;
;   Putting it in configuration rather than in the CI command is deliberate:
;   a fix in ci.yml would work only for CI, and the next person to run bare
;   `pytest` locally would rediscover the same failure.
;
; THE LESSON
;   The pipeline earned its keep before it ever deployed anything. A test
;   suite that only passes when invoked one particular way is not yet a test
;   suite - it is a habit. CI is a second, less forgiving reader of your
;   assumptions.

[pytest]
pythonpath = .

; Registered here as well as in conftest.py so `pytest --markers` lists them
; and a typo like `-m liv` is an error rather than a silent match of nothing.
markers =
    live: needs Bedrock credentials (costs money)
    db: needs a seeded Postgres database

; Quieter output, and a short summary line for anything that is not a plain
; pass - so a skipped live test is VISIBLE in the CI log rather than hiding
; behind a dot.
addopts = -ra --strict-markers
testpaths = tests
